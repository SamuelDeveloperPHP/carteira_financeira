name: CI

# Roda a cada envio e a cada pull request. Três etapas independentes:
#   backend  - 101 testes (unitários + integração com PostgreSQL) no Docker
#   qualidade - formatação (Prettier) e lint (ESLint)
#   frontend - verificação de tipos e auditoria de dependências
#   e2e      - sobe o sistema inteiro e roda o fluxo do cliente em navegador real
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (testes no Docker)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Gerar segredos efêmeros
        run: |
          {
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 32)"
            echo "APP_DB_PASSWORD=$(openssl rand -hex 32)"
            echo "TOTP_ENCRYPTION_KEY=$(openssl rand -hex 32)"
            echo "TEST_DB_PASSWORD=$(openssl rand -hex 32)"
            echo "WALLET_PORT=3080"
          } > .docker.env
      - name: Testes (unitários e integração)
        run: docker compose --env-file .docker.env --profile test run --rm --build tests

  qualidade:
    name: Qualidade (formatação e lint)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Formatação (Prettier)
        run: npm run format:check
      - name: Lint (ESLint)
        run: npm run lint

  frontend:
    name: Frontend (tipos e dependências)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json
      - name: Frontend - instalar e verificar tipos
        working-directory: frontend
        run: |
          npm ci
          npx tsc --noEmit
      - name: Backend - instalar e verificar tipos
        working-directory: backend
        run: |
          npm ci
          npx tsc --noEmit
      # Auditoria informativa: um aviso novo em dependência de terceiros não deve
      # derrubar a entrega, mas precisa aparecer no log.
      - name: Auditoria de dependências (produção)
        continue-on-error: true
        run: |
          (cd frontend && npm audit --omit=dev --audit-level=high)
          (cd backend && npm audit --omit=dev --audit-level=high)

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Gerar segredos efêmeros
        run: |
          {
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 32)"
            echo "APP_DB_PASSWORD=$(openssl rand -hex 32)"
            echo "TOTP_ENCRYPTION_KEY=$(openssl rand -hex 32)"
            echo "TEST_DB_PASSWORD=$(openssl rand -hex 32)"
            echo "WALLET_PORT=3080"
          } > .docker.env
      - name: Subir o sistema (banco, migração, API, frontend e gateway)
        run: docker compose --env-file .docker.env up -d --build --wait --wait-timeout 300
      - name: Verificar a saúde
        run: curl --fail --silent --retry 10 --retry-delay 3 --retry-connrefused http://localhost:3080/api/health
      - name: Instalar o Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Rodar os testes de tela
        working-directory: e2e
        run: npx playwright test
      - name: Relatório do Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7
      - name: Logs dos containers
        if: failure()
        run: docker compose --env-file .docker.env logs --no-color --tail 200
      - name: Derrubar
        if: always()
        run: docker compose --env-file .docker.env down -v
