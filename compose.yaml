name: carteira_financeira
x-api: &api
  build: ./backend
  image: carteira_financeira-api:local
  init: true
  restart: unless-stopped
  networks: [wallet]
services:
  db:
    image: postgres:16-alpine
    ports: ["127.0.0.1:5433:5432"]
    environment:
      POSTGRES_DB: carteira
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/setup.ps1 first}
    volumes: [wallet-data:/var/lib/postgresql/data]
    networks: [wallet]
    restart: unless-stopped
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U postgres -d carteira"]
      interval: 5s
      timeout: 3s
      retries: 15
  migrate:
    <<: *api
    restart: "no"
    command: [node, dist/migrate.js]
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/carteira
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
    depends_on:
      db: { condition: service_healthy }
  api:
    <<: *api
    environment:
      DATABASE_URL: postgresql://wallet_app:${APP_DB_PASSWORD}@db:5432/carteira
      TOTP_ENCRYPTION_KEY: ${TOTP_ENCRYPTION_KEY}
      APP_ORIGINS: http://localhost:${WALLET_PORT:-3080},http://127.0.0.1:${WALLET_PORT:-3080}
      COOKIE_SECURE: "false"
      DEMO_DEPOSITS: "true"
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  web:
    build: ./frontend
    image: carteira_financeira-web:local
    networks: [wallet]
    restart: unless-stopped
    init: true
    environment: { NODE_ENV: production, HOSTNAME: "0.0.0.0", PORT: "3000" }
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
  gateway:
    image: nginx:1.27-alpine
    ports: ["127.0.0.1:${WALLET_PORT:-3080}:80"]
    volumes: [./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro]
    networks: [wallet]
    restart: unless-stopped
    depends_on:
      api: { condition: service_healthy }
      web: { condition: service_healthy }
  test-db:
    profiles: [test]
    image: postgres:16-alpine
    environment:
      { POSTGRES_DB: carteira_test, POSTGRES_PASSWORD: "${TEST_DB_PASSWORD}" }
    tmpfs: [/var/lib/postgresql/data]
    networks: [wallet]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U postgres -d carteira_test"]
      interval: 3s
      timeout: 3s
      retries: 15
  tests:
    <<: *api
    profiles: [test]
    restart: "no"
    environment:
      DATABASE_URL: postgresql://postgres:${TEST_DB_PASSWORD}@test-db:5432/carteira_test
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      TOTP_ENCRYPTION_KEY: ${TOTP_ENCRYPTION_KEY}
      APP_ORIGINS: http://localhost:3080
      DEMO_DEPOSITS: "true"
    command:
      [
        sh,
        -c,
        "node dist/migrate.js && node --test --test-concurrency=1 test/*.test.mjs",
      ]
    depends_on:
      test-db: { condition: service_healthy }
volumes:
  wallet-data:
networks:
  wallet:
