server {
  listen 80;
  server_tokens off;
  client_max_body_size 16k;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header X-Frame-Options DENY always;
  # CSP do frontend. 'unsafe-inline' em script/style: o Next injeta os dados de
  # hidratação em <script> inline e Leaflet/SweetAlert2 usam style inline; um nonce
  # por requisição exigiria renderização dinâmica. 'wasm-unsafe-eval' e blob:
  # são do reconhecimento facial (TensorFlow.js). Tiles: OpenStreetMap.
  # HSTS não é enviado: sem TLS ele seria ignorado; ligar ao publicar em HTTPS.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://tile.openstreetmap.org https://*.tile.openstreetmap.org; font-src 'self'; connect-src 'self' blob: data:; worker-src 'self' blob:; media-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
  add_header Permissions-Policy "geolocation=(self), camera=(self), microphone=()" always;
  location /api/ {
    proxy_pass http://api:3001;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_http_version 1.1;
  }
  location / {
    proxy_pass http://web:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
  }
}
